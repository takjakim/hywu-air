# 동아리 (학과 공식 '동아리' 게시판 기준)
- name: 한마음
  tag: 봉사
  desc: "2016년에 만들어진 봉사 동아리. 승무원을 꿈꾸는 중고등학생 대상 직업진로체험과 입시 멘토링으로 '교육 기부 우수동아리'에 선정됐고, 유기동물, 어린이집 봉사도 이어 가고 있어요."
- name: 하이바이 HYBUY
  tag: 창업
  desc: "항공, 호스피탈리티 취업 준비생을 위한 제품을 직접 기획하고 만드는 창업 동아리. 졸업 곰인형 판매, 플리마켓 참여, 창업창직비전캠프 사업계획 보고서 대상 수상 경험이 있어요."
- name: 아마빌레 AMABILE
  tag: 음악
  desc: "'우아하고 사랑스럽게 연주하자'는 뜻의 실내악 동아리. 학과 행사 무대를 직접 꾸리며 각자의 특기를 살려요."
