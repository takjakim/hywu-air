# 자주 묻는 질문. 출처는 2027학년도 수시 모집요강, 학교 공식 학과 소개입니다.
- q: "항공과는 몇 년제이고, 몇 명을 뽑나요?"
  a: "2년제 학과이고 입학정원은 100명입니다. 2027학년도 수시 기준으로 수시1차 일반전형 80명, 수시2차 일반전형 19명을 모집하며, 정원 외로 농어촌 4명, 기회균형 2명(수시1차), 전문대 이상 졸업자 2명(수시2차)을 뽑습니다."
- q: "어떻게 평가하나요?"
  a: "수시 일반전형은 학생부 40%와 면접 60%로 평가합니다. 면접에서는 전공적성 및 의사표현력, 학업성취 의욕과 직업관, 예절 및 태도, 발전 가능성을 봅니다."
- q: "면접에서 영어 지문 읽기를 하나요?"
  a: "2027학년도부터 항공과 면접의 영어 지문 읽기는 폐지되었습니다."
- q: "호텔관광과와 같이 지원할 수 있나요?"
  a: "같은 모집 시기에 면접(실기) 학과끼리는 복수지원이 안 됩니다. 항공과와 호텔관광과, 항공과와 실용음악과는 함께 지원할 수 없고, 항공과와 면접이 없는 학과(예: 실무영어과)는 함께 지원할 수 있습니다."
- q: "면접 날 무엇을 챙겨야 하나요?"
  a: "모바일 수험표(알림톡 QR)와 사진이 붙은 신분증(주민등록증, 사진과 생년월일이 있는 학생증, 여권, 청소년증 등)을 챙기세요. 자세한 신분증 종류는 모집요강의 '실기(면접)고사 당일 준비물'을 확인하세요."
- q: "졸업하면 어디로 가나요?"
  a: "국내외 항공사 객실승무원, 항공사 지상직, 공항 VIP 라운지 등으로 진출합니다. 최근에도 대한항공, 에티하드항공 객실승무원 합격 소식이 학과 게시판에 올라왔어요."
- q: "학교 다니면서 딸 수 있는 자격증은요?"
  a: "항공예약발권(TOPAS, Amadeus), SMAT, CPR, 바리스타, 와인 소믈리에, 조주기능사, CS 리더스관리사 등 수업과 연계된 자격증을 준비할 수 있습니다."
