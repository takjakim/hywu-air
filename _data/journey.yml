# '2년 동안 이렇게 자라요' 단계 (과목 개설 학기는 공식 교육과정 로드맵을 따릅니다)
- step: "STEP 1"
  title: "서비스 기본기"
  desc: "첫인상, 매너, 소통부터. 항공 서비스인의 기본 자세를 몸에 익혀요."
  tags: [이미지메이킹, 서비스커뮤니케이션, 관광학원론, 인간관계와 심리]
- step: "STEP 2"
  title: "기내 실무"
  desc: "실제 객실과 닮은 실습실에서 기내방송, 음료 서비스, 안전 절차를 연습해요."
  tags: [항공객실서비스실무, 기내방송, 기내음료서비스, 항공안전업무(VR), 항공응급의료실무]
- step: "STEP 3"
  title: "공항과 예약발권"
  desc: "TOPAS, Amadeus로 예약과 발권을 다뤄 보고 스마트공항 서비스를 배워요."
  tags: [항공지상서비스, 항공예약실무, 항공운임발권실무, 스마트공항서비스 실무]
- step: "STEP 4"
  title: "취업 완성"
  desc: "면접 실무와 모의비행 캡스톤으로 실전 감각을 만들고, 선배 특강과 기업 탐방으로 진로를 구체화해요."
  tags: [항공면접 실무, 캡스톤디자인 항공모의비행, 항공P.E, 취업 선배 특강]
