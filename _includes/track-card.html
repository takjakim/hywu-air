<article class="card card-media track">
  <div class="card-media-img">{% include illust.html name=include.track.id %}</div>
  <div class="card-media-body">
    <p class="track-en">{{ include.track.en }}</p>
    <h3>{{ include.track.title }}</h3>
    <p>{{ include.track.desc }}</p>
  </div>
</article>
