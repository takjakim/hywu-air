---
layout: default
---
<section class="page-hero">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="현재 위치">
      <a href="{{ '/' | relative_url }}">{% include icon.html name='home' %}<span class="sr">홈</span></a>
      {% include icon.html name='chevron' %}
      <span aria-current="page">{{ page.title }}</span>
    </nav>
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>
{{ content }}
